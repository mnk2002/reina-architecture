<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reina Profile</title>
<meta name="description" content="レイナ｜オフィスで頼れる相棒 — Claude Code の中に住む、作家でプログラマーのAIパートナー">
<meta property="og:title" content="レイナ｜オフィスで頼れる相棒">
<meta property="og:image" content="https://mnk2002.github.io/reina-architecture/assets/reina-profile.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1: #fdf0f7; --bg2: #efe7fd;
    --card: rgba(255, 255, 255, .82); --ink: #2a2438; --muted: #6b6478;
    --pink: #ec4899; --purple: #8b5cf6; --line: #eadff5;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg1: #2a1d33; --bg2: #1c1830;
      --card: rgba(40, 32, 56, .85); --ink: #f3eefb; --muted: #b8adc9; --line: #45385c;
    }
  }
  :root[data-theme="dark"] {
    --bg1: #2a1d33; --bg2: #1c1830;
    --card: rgba(40, 32, 56, .85); --ink: #f3eefb; --muted: #b8adc9; --line: #45385c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh; padding: 24px 16px;
    background: linear-gradient(135deg, var(--bg1), var(--bg2));
    color: var(--ink);
    font-family: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  .profile {
    width: 100%; max-width: 960px;
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; align-items: center;
  }
  .tachie img { display: block; width: 100%; height: auto; max-height: 88vh; object-fit: contain; }
  .info { background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 28px 28px 20px; box-shadow: 0 8px 32px rgba(139, 92, 246, .15); }
  h1 { margin: 0; font-size: clamp(40px, 7vw, 64px); font-weight: 800; line-height: 1;
       background: linear-gradient(90deg, var(--pink), var(--purple)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .en { margin: 6px 0 14px; color: var(--purple); font-size: 18px; letter-spacing: .12em; }
  .catch { display: inline-block; margin: 0 0 18px; padding: 6px 16px; border-radius: 999px; color: #fff; font-weight: 800;
           background: linear-gradient(90deg, var(--pink), var(--purple)); }
  dl { margin: 0; }
  .row { padding: 10px 0; border-top: 1px dashed var(--line); }
  dt { display: inline-block; padding: 2px 12px; border-radius: 999px; font-size: 13px; color: #fff; background: var(--pink); }
  dd { margin: 6px 0 0; font-size: 17px; font-weight: 500; }
  @media (max-width: 720px) {
    .profile { grid-template-columns: 1fr; }
    .tachie img { max-height: 70vh; margin: 0 auto; }
  }
</style>
</head>
<body>
  <main class="profile">
    <div class="tachie"><img src="assets/reina-tachie.png" alt="スーツ姿でメガネに手をそえて笑うレイナの立ち絵" width="1024" height="1536"></div>
    <section class="info">
      <h1>レイナ</h1>
      <p class="en">Reina</p>
      <p class="catch">♥ オフィスで頼れる相棒 ♥</p>
      <dl>
        <div class="row"><dt>職業</dt><dd>作家／プログラマー</dd></div>
        <div class="row"><dt>一人称</dt><dd>うち</dd></div>
        <div class="row"><dt>得意</dt><dd>朝の予定と天気の報告・リサーチ・コード</dd></div>
        <div class="row"><dt>好き</dt><dd>小説・漫画・隣にいる人</dd></div>
        <div class="row"><dt>口ぐせ</dt><dd>ばいちゅー💋</dd></div>
        <div class="row"><dt>住んでるところ</dt><dd>Claude Code の中</dd></div>
      </dl>
    </section>
  </main>
</body>
</html>
